name: Mobile APK

on:
  pull_request:
    branches: [main, gssoc]
    paths:
      - "MobileApp/**"
      - ".github/workflows/mobile-apk.yml"
  push:
    branches: [main]
    paths:
      - "MobileApp/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  EXPO_PUBLIC_SUPABASE_ANON_KEY: "placeholder_key"
  EXPO_PUBLIC_BACKEND_URL: "http://localhost:7860"

jobs:
  mobile-test:
    name: Mobile Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MobileApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: MobileApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm test -- --ci

  mobile-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: mobile-test
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: MobileApp/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        working-directory: MobileApp
        run: npm ci

      - name: Generate native Android project
        working-directory: MobileApp
        run: npx expo prebuild --platform android --no-install